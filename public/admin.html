<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace gestionnaire — Palezza Network</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/extra.css">
  <script>(function(){var d=document.documentElement;d.classList.add('js');try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))d.classList.add('dark');}catch(e){}})();</script>
</head>
<body class="bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
<header class="border-b border-zinc-200 bg-white dark:border-white/10 dark:bg-zinc-950"><div class="mx-auto flex h-16 max-w-3xl items-center justify-between px-5"><a href="index.html" aria-label="Retour au site"><img src="assets/img/logo.png" alt="Palezza Networks" class="logo-img" width="900" height="84"></a><div class="flex items-center gap-3"><span class="text-sm font-semibold text-zinc-600 dark:text-zinc-300">Espace gestionnaire</span><button id="out" class="btn btn-secondary" hidden>Se déconnecter</button></div></div></header>
<main class="mx-auto max-w-3xl px-5 py-10">
<p id="setup" class="rounded-xl bg-amber-50 p-4 text-sm text-amber-900" hidden>Supabase n’est pas encore configuré. Renseignez l’URL et la clé dans <b>assets/js/config.js</b>, puis redéposez le site.</p>
<section id="login" hidden><h1 class="text-2xl font-bold text-zinc-950 dark:text-white">Connexion</h1><p class="mt-2 text-sm text-zinc-600 dark:text-zinc-400">Accès réservé au gestionnaire du site.</p>
<form id="lf" class="mt-6 grid gap-4"><div><label for="em" class="label">E-mail</label><input id="em" type="email" autocomplete="username" class="input" required></div><div><label for="pw" class="label">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" class="input" required></div><button class="btn btn-primary" type="submit">Se connecter</button><p id="le" class="text-sm font-medium text-rose-600" role="alert"></p></form></section>
<section id="ed" hidden><h1 class="text-2xl font-bold text-zinc-950 dark:text-white">Contenu du site</h1><p class="mt-2 text-sm text-zinc-600 dark:text-zinc-400">Les modifications apparaissent sur le site dès l’enregistrement.</p>
<form id="ef" class="mt-8 grid gap-10"><div id="ec"></div><div class="sticky bottom-4 flex items-center gap-3 rounded-2xl bg-white p-3 shadow-lg ring-1 ring-zinc-200 dark:bg-zinc-900 dark:ring-white/10"><button class="btn btn-primary" type="submit">Enregistrer</button><p id="sm" class="text-sm font-medium" role="status"></p></div></form></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script><script src="assets/js/defaults.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)},C=window.PN_CFG||{},D=window.PN_DEFAULTS,S,sb,B='site-images';
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function show(w){["#setup","#login","#ed"].forEach(function(x){$(x).hidden=x!==w});$("#out").hidden=w!=="#ed"}
if(!C.url||!C.key||!window.supabase){show("#setup");return}
sb=window.supabase.createClient(C.url,C.key);
function fld(id,l,v,k,ta){return '<div><label class="label" for="'+id+'">'+l+'</label>'+(ta?'<textarea id="'+id+'" rows="3" class="input resize-y" data-k="'+k+'">'+esc(v)+'</textarea>':'<input id="'+id+'" class="input" data-k="'+k+'" value="'+esc(v)+'">')+'</div>'}
function img(k,u){return '<div><span class="label">Image (facultatif)</span><div class="mt-1 flex flex-wrap items-center gap-3">'+(u?'<img src="'+esc(u)+'" alt="" class="h-16 w-24 rounded-lg object-cover ring-1 ring-zinc-200">':'')+'<input type="hidden" data-k="'+k+'.image" value="'+esc(u||'')+'"><label class="btn btn-secondary cursor-pointer">'+(u?'Changer l’image':'Choisir une image')+'<input type="file" accept="image/*" class="sr-only" data-up="'+k+'"></label>'+(u?'<button type="button" class="text-sm font-semibold text-rose-600" data-rm="'+k+'">Retirer</button>':'')+'</div></div>'}
function tgt(k){var m=k.match(/^([pj])(\d+)$/);return(m[1]==="p"?S.panels:S.projects)[+m[2]]}
function shrink(f,cb){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var r=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas'),x;c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(cb,'image/jpeg',.82)};im.onerror=function(){cb(null)};im.src=u}
function msg(t,c){var m=$("#sm");m.className="text-sm font-medium "+c;m.textContent=t}
function render(){var h='<div class="card grid gap-4 p-6"><h2 class="text-lg font-semibold">Contact</h2>'+fld('f-w','Numéro WhatsApp (indicatif sans +, sans espaces)',S.whatsapp,'whatsapp')+fld('f-e','E-mail public',S.email,'email')+'</div>';
h+='<div class="mt-10 flex items-center justify-between"><h2 class="text-lg font-semibold">Panneau d’affichage ('+S.panels.length+'/7)</h2>'+(S.panels.length<7?'<button type="button" id="aq" class="btn btn-secondary">Ajouter un panneau</button>':'')+'</div>';
S.panels.forEach(function(p,i){h+='<div class="card mt-4 grid gap-4 p-6"><div class="flex items-center justify-between"><h3 class="font-semibold">Panneau '+(i+1)+'</h3>'+(S.panels.length>1?'<button type="button" class="text-sm font-semibold text-rose-600" data-delp="'+i+'">Supprimer</button>':'')+'</div>'+fld('p'+i+'a','Rubrique',p.eyebrow,'p'+i+'.eyebrow')+fld('p'+i+'b','Titre',p.title,'p'+i+'.title')+fld('p'+i+'c','Texte',p.text,'p'+i+'.text',1)+img('p'+i,p.image)+'</div>'});
h+='<div class="mt-10 flex items-center justify-between"><h2 class="text-lg font-semibold">Réalisations</h2><button type="button" id="ap" class="btn btn-secondary">Ajouter un projet</button></div>';
S.projects.forEach(function(p,i){h+='<div class="card mt-4 grid gap-4 p-6"><div class="flex items-center justify-between"><h3 class="font-semibold">Projet '+(i+1)+'</h3><button type="button" class="text-sm font-semibold text-rose-600" data-del="'+i+'">Supprimer</button></div>'+fld('j'+i+'a','Type (Site web, Logiciel…)',p.type,'j'+i+'.type')+fld('j'+i+'b','Titre',p.title,'j'+i+'.title')+fld('j'+i+'c','Description',p.text,'j'+i+'.text',1)+fld('j'+i+'d','Lien public (https://…, facultatif)',p.link,'j'+i+'.link')+img('j'+i,p.image)+'</div>'});
$("#ec").innerHTML=h;
$("#ap").onclick=function(){grab();if(S.projects.length>=8)return;S.projects.push({type:"Site web",title:"",text:"",link:"",image:""});render()};
if($("#aq"))$("#aq").onclick=function(){grab();if(S.panels.length>=7)return;S.panels.push({eyebrow:"",title:"",text:"",image:""});render()};
[].forEach.call(document.querySelectorAll("[data-del]"),function(b){b.onclick=function(){grab();S.projects.splice(+b.dataset.del,1);render()}});
[].forEach.call(document.querySelectorAll("[data-delp]"),function(b){b.onclick=function(){grab();S.panels.splice(+b.dataset.delp,1);render()}});
[].forEach.call(document.querySelectorAll("[data-rm]"),function(b){b.onclick=function(){grab();tgt(b.dataset.rm).image="";render()}});
[].forEach.call(document.querySelectorAll("[data-up]"),function(inp){inp.onchange=function(){var f=inp.files[0],k=inp.dataset.up;if(!f)return;grab();msg("Envoi de l’image…","text-zinc-600");
shrink(f,function(bl){if(!bl){msg("Image illisible.","text-rose-600");return}var path='img/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
sb.storage.from(B).upload(path,bl,{contentType:'image/jpeg',upsert:true}).then(function(r){if(r.error){msg("Échec de l’envoi de l’image.","text-rose-600");return}tgt(k).image=sb.storage.from(B).getPublicUrl(path).data.publicUrl;render();msg("Image ajoutée. Pensez à cliquer sur Enregistrer.","text-emerald-600")})})}});}
function grab(){[].forEach.call(document.querySelectorAll("[data-k]"),function(el){var k=el.dataset.k,m=k.match(/^([pj])(\d+)\.(.+)$/);
if(!m)S[k]=k==="whatsapp"?el.value.replace(/\D/g,''):el.value.trim();else (m[1]==="p"?S.panels:S.projects)[+m[2]][m[3]]=el.value.trim()})}
function open(){sb.from('site_settings').select('value').eq('key','site').maybeSingle().then(function(r){var v=r.data&&r.data.value||{};S=JSON.parse(JSON.stringify(D));
Object.keys(v).forEach(function(k){if(v[k]!=null)S[k]=v[k]});if(!S.panels.length)S.panels.push({eyebrow:"",title:"",text:""});S.panels=S.panels.slice(0,7);render();show("#ed")})}
$("#lf").onsubmit=function(e){e.preventDefault();$("#le").textContent="";sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value}).then(function(r){if(r.error){$("#le").textContent="E-mail ou mot de passe incorrect.";return}$("#pw").value="";open()})};
$("#ef").onsubmit=function(e){e.preventDefault();grab();msg("Enregistrement…","text-zinc-600");
S.panels=S.panels.filter(function(p){return p.title||p.text||p.image});if(!S.panels.length)S.panels=JSON.parse(JSON.stringify(D.panels.slice(0,1)));
S.projects=S.projects.filter(function(p){return p.title||p.text});
sb.from('site_settings').upsert({key:'site',value:S,updated_at:new Date().toISOString()}).then(function(r){if(r.error){msg("Échec : accès refusé ou connexion impossible.","text-rose-600");return}msg("Enregistré. Le site est à jour.","text-emerald-600");render()})};
$("#out").onclick=function(){sb.auth.signOut().then(function(){show("#login")})};
sb.auth.getSession().then(function(r){r.data&&r.data.session?open():show("#login")});
})();
</script></body></html>
